# Continuous integration — specs/testing/ci.md.
#
# Three jobs side by side on GitHub's hosted runners, on every pull request and push to main:
# `check` (lint, format, types), `fast-tier` (tests/) and `e2e-sim` (tests-e2e/ against real
# NAOqi stacks the runner fetches, builds and verifies itself), once per NAOqi version, each
# entry on its own runner since both publish 9559. None waits on another. The fast tier runs on
# Linux, macOS and Windows; the rest on Linux: macOS and Windows runners can't run naoqi-sim's
# Linux containers. No secret is needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesa's GL and a virtual X display, for the sim-window test on the 2.1 entry; libegl1 and
  # libgl1-mesa-dri are what the headless viewer renders through (specs/testing/ci.md).
  APT_WINDOW: xvfb xauth libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri
  # A virtual audio loopback for the tests that use real sound devices: PulseAudio and its tools,
  # PortAudio (sounddevice takes it from the system on Linux) and the ALSA plugin that routes
  # ALSA's default device, the one PortAudio opens, to PulseAudio.
  APT_AUDIO: pulseaudio pulseaudio-utils libportaudio2 libasound2-plugins

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check (code directories only — `ruff format .` reflows Markdown)
        run: uv run ruff format --check src tests tests-e2e docker/tts-engine docker/perception-engine
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Each platform its own qi wheel and Python behaviour (paths, encodings, signals); one
      # failing leaves the others running (specs/testing/ci.md).
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (against the lock)
        run: uv sync --locked
      - name: Fast tier
        # The code that runs in the Linux containers is tested once, on Linux: another host
        # adds nothing to it (specs/testing/ci.md).
        run: uv run pytest -rs ${{ runner.os != 'Linux' && '-m "not container_code"' || '' }}

  e2e-sim:
    name: live tier, NAOqi ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["2.1", "2.8"]
    steps:
      # The 2.8 image and its `docker save` archive take about 13 GB, the suite 1.3 GB more on
      # a cold build: drop the toolchains naoqi-sim never uses. Both entries, so they stay alike.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (against the lock)
        run: uv sync --locked
      # Keyed on what `check_images` compares to the image labels (the naoqi-sim version and the
      # digest of the docker/ recipes) and on the suite pins, which the labels do not see.
      - name: Image cache key
        id: key
        run: |
          stamp=$(uv run python -c "from naoqi_sim import docker_images as d; print(f'{d.naoqi_sim_version()}-{d.recipes_digest()}')")
          echo "key=naoqi-${{ matrix.version }}-$stamp-${{ hashFiles('src/naoqi_sim/suite.py') }}" >> "$GITHUB_OUTPUT"
      # The version's NAOqi image, the tts and perception images, saved with `docker save`, and the record
      # of their verified IDs. The images contain Aldebaran's software: a cache only this
      # repository's workflows read, never a registry. The image data are never cached.
      - name: Images (restore)
        id: images
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/images.tar
            docker/image-data/images.json
          key: ${{ steps.key.outputs.key }}
      - name: Load the cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: |
          docker load -i "$RUNNER_TEMP/images.tar"
          rm "$RUNNER_TEMP/images.tar"
      - name: Fetch, build and verify the images (naoqi-sim fetch-and-build-images)
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          uv run naoqi-sim fetch-and-build-images ${{ matrix.version }}
          image=$(uv run python -c "from naoqi_sim.docker_images import IMAGES; print(IMAGES['${{ matrix.version }}'].image)")
          docker save -o "$RUNNER_TEMP/images.tar" "$image" naoqi-sim/tts:dev naoqi-sim/perception:dev
          rm -rf docker/image-data/${{ matrix.version }}
      # Saved right after the build, not at the end of the job, so a failing live tier
      # doesn't build again on the next run.
      - name: Images (save)
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/images.tar
            docker/image-data/images.json
          key: ${{ steps.key.outputs.key }}
      - name: Drop the saved archive
        if: steps.images.outputs.cache-hit != 'true'
        run: rm -f "$RUNNER_TEMP/images.tar"
      - name: System packages (Mesa GL, virtual display, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_WINDOW $APT_AUDIO
      # A null sink as the default output and its monitor as the default input: a virtual
      # microphone wired to a virtual loudspeaker (as reachy-mini-bridge's live job).
      - name: Audio loopback (PulseAudio null sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci sink_properties=device.description=ci
          pactl set-default-sink ci
          pactl set-default-source ci.monitor
          # A null sink renders at the latency its clients ask for, up to about 1.5 s when none
          # asks for less (measured): a silent client at 10 ms for the whole job keeps it awake
          # and low, so what is played is heard within a few ms, as from a real loudspeaker.
          nohup pacat --playback --raw --format=s16le --rate=48000 --channels=1 \
            --latency-msec=10 -d ci < /dev/zero > /dev/null 2>&1 &
          pactl info
          uv run python -c "import sounddevice as sd; print(sd.query_devices()); print('default:', sd.default.device)"
      - name: Live tier
        env:
          # This version only, and a missing image or Docker fails instead of skipping.
          NAOQI_SIM_E2E_VERSION: ${{ matrix.version }}
          # The default sound devices are the loopback above: the audio device tests run.
          NAOQI_SIM_E2E_AUDIO: loopback
        # Warnings and errors print live. xvfb-run gives the sim window an X display.
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          uv run pytest tests-e2e -rs -o log_cli=true --log-cli-level=WARNING
      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --filter name=naoqi-sim- --format '{{.Names}}'); do
            echo "::group::$c"
            docker logs --tail 300 "$c" 2>&1
            echo "::endgroup::"
          done
