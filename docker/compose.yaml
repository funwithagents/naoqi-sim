# The project is always `naoqi-sim` (containers, network, the package store and voice volumes).
name: naoqi-sim

services:
  tts:
    build:
      context: ./tts-engine
      labels:
        io.naoqi-sim.version: ${NAOQI_SIM_VERSION:-dev}
        io.naoqi-sim.recipes: ${NAOQI_SIM_RECIPES:-}
    image: naoqi-sim/tts:dev
    container_name: naoqi-sim-tts
    environment:
      NAOQI_SIM_SOUNDCARD: host.docker.internal:9562
      # The installed languages (the config's speech.languages): the engine loads their voices
      # before it is healthy, fetching into the volume those the image lacks.
      NAOQI_SIM_LANGUAGES: ${NAOQI_SIM_LANGUAGES:-English,French}
    volumes:
      - piper-voices:/voices
    healthcheck:
      # 200 once every installed language's voice is loaded, 503 meanwhile; a language's first
      # use downloads its voice (about 60 MB), hence the long start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 3
      start_period: 600s
    extra_hosts:
      - "host.docker.internal:host-gateway"
  perception:
    build:
      context: ./perception-engine
      labels:
        io.naoqi-sim.version: ${NAOQI_SIM_VERSION:-dev}
        io.naoqi-sim.recipes: ${NAOQI_SIM_RECIPES:-}
    image: naoqi-sim/perception:dev
    container_name: naoqi-sim-perception
    healthcheck:
      # 200 once the face detection model is loaded (well under a second), 503 meanwhile.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 2s
      timeout: 6s
      retries: 3
      start_period: 30s
  naoqi21:
    profiles: ["2.1"]
    build:
      context: ./naoqi
      dockerfile: Dockerfile.naoqi-2.1
      # The suite and animations.pkg (COPY --from=image-data): the image data folder naoqi-sim passes as
      # NAOQI_SIM_IMAGE_DATA, or a checkout's ./image-data when compose runs by hand.
      additional_contexts:
        image-data: ${NAOQI_SIM_IMAGE_DATA:-./image-data}/2.1
      args:
        NAOQI_SIM_VERSION: ${NAOQI_SIM_VERSION:-dev}
      labels:
        io.naoqi-sim.version: ${NAOQI_SIM_VERSION:-dev}
        io.naoqi-sim.recipes: ${NAOQI_SIM_RECIPES:-}
    image: naoqi-sim/naoqi:2.1.4.13
    platform: linux/amd64
    container_name: naoqi-sim-naoqi21
    environment:
      NAOQI_SIM_TTS_URL: http://tts:8080
      # The perception engine ALFaceDetection posts its frames to; the host sets it empty to run
      # without one (perception.enabled = false), hence `-` and not `:-`.
      NAOQI_SIM_PERCEPTION_URL: ${NAOQI_SIM_PERCEPTION_URL-http://perception:8080}
      # The installed languages, what ALTextToSpeech.getAvailableLanguages answers (specs/services/speech.md).
      NAOQI_SIM_LANGUAGES: ${NAOQI_SIM_LANGUAGES:-English,French}
      # The host link (specs/host/devices.md): ALAudioDevice connects out to the host's audio input.
      NAOQI_SIM_HOST_LINK: host.docker.internal:9563
      # The host audio output, which ALAudioPlayer streams its sounds into (specs/services/audio-player.md).
      NAOQI_SIM_SOUNDCARD: host.docker.internal:9562
    # Started after the engine, not after its voices: both boot in parallel and NaoqiSim.start()
    # waits for each to be healthy (specs/runtime/api.md, "Lifecycle").
    depends_on: [tts]
    ports:
      - "127.0.0.1:9559:9559"
    volumes:
      - packages-2.1:/home/nao/.local/share/PackageManager
    extra_hosts:
      - "host.docker.internal:host-gateway"
  naoqi28:
    profiles: ["2.8"]
    build:
      context: ./naoqi
      dockerfile: Dockerfile.naoqi-2.8
      # The suite and animations.pkg (COPY --from=image-data): the image data folder naoqi-sim passes as
      # NAOQI_SIM_IMAGE_DATA, or a checkout's ./image-data when compose runs by hand.
      additional_contexts:
        image-data: ${NAOQI_SIM_IMAGE_DATA:-./image-data}/2.8
      args:
        NAOQI_SIM_VERSION: ${NAOQI_SIM_VERSION:-dev}
      labels:
        io.naoqi-sim.version: ${NAOQI_SIM_VERSION:-dev}
        io.naoqi-sim.recipes: ${NAOQI_SIM_RECIPES:-}
    image: naoqi-sim/naoqi:2.8.7.4
    platform: linux/amd64
    container_name: naoqi-sim-naoqi28
    environment:
      NAOQI_SIM_TTS_URL: http://tts:8080
      # The perception engine ALFaceDetection posts its frames to; the host sets it empty to run
      # without one (perception.enabled = false), hence `-` and not `:-`.
      NAOQI_SIM_PERCEPTION_URL: ${NAOQI_SIM_PERCEPTION_URL-http://perception:8080}
      # The installed languages, what ALTextToSpeech.getAvailableLanguages answers (specs/services/speech.md).
      NAOQI_SIM_LANGUAGES: ${NAOQI_SIM_LANGUAGES:-English,French}
      # The host link (specs/host/devices.md): ALAudioDevice connects out to the host's audio input.
      NAOQI_SIM_HOST_LINK: host.docker.internal:9563
      # The host audio output, which ALAudioPlayer streams its sounds into (specs/services/audio-player.md).
      NAOQI_SIM_SOUNDCARD: host.docker.internal:9562
    depends_on: [tts]
    ports:
      - "127.0.0.1:9559:9559"
    volumes:
      - packages-2.8:/home/nao/.local/share/PackageManager
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Package stores (PackageManager's apps/ and pm.db), one per version: packages installed over qi
# or Choregraphe survive `docker compose down`; `down -v` resets to the image's factory packages.
# The voices the speech engine fetched for the languages the image lacks: one volume, voices do
# not depend on the NAOqi version; `down -v` empties it and the image's default voices remain.
volumes:
  packages-2.1:
  packages-2.8:
  piper-voices:
