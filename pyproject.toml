[project]
name = "naoqi-sim"
version = "0.1.0"
description = "A NAO in a box: NAOqi in Docker with host-side devices (audio, video, touch) and a viewer."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "platformdirs",
    "qi>=3.1.8,<4",
    "sounddevice",
]

[project.optional-dependencies]
# The sim window and the render camera (specs/host/viewer.md).
viewer = ["naoqi-viewer"]
# The webcam source of the video input (specs/host/video-input.md, "The webcam source").
webcam = ["opencv-python-headless"]

[project.scripts]
naoqi-sim = "naoqi_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package, and the container recipes as its package data (specs/project.md, "Distribution"):
# all of docker/ but the image data, which are Aldebaran's and never leave the machine.
only-include = ["src/naoqi_sim", "docker"]
exclude = ["docker/image-data", "__pycache__", "*.pyc"]
# hatch cannot make an editable install from a remapped path: a checkout puts src/ on the path
# and uses docker/ where it is.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/naoqi_sim" = "naoqi_sim"
"docker" = "naoqi_sim/docker"

[dependency-groups]
dev = [
    # the viewer code type-checks against naoqi-viewer's real API; the fast tier converts webcam
    # frames with the real OpenCV
    "naoqi-sim[viewer,webcam]",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

# libqi Python 3 wheels come from the funwithagents fork's package index on GitHub Pages, not PyPI
# (PyPI's `qi` is Aldebaran's older 3.1.5). The fork builds them for macOS arm64, Linux x86_64 and
# Windows x64 only.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "libqi"
url = "https://funwithagents.github.io/libqi-python/simple/"
explicit = true  # only the packages pinned to it below come from it

[tool.uv.sources]
qi = { index = "libqi" }
# naoqi-viewer is not on PyPI yet (specs/project.md, open question 1): its repository, pinned.
naoqi-viewer = { git = "https://github.com/funwithagents/naoqi-viewer", rev = "6fd1050608b5e7646697486f36dc1753c0336e69" }

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python
# docker/naoqi/services/ is Python 2.7 running inside NAOqi (naoqi, qi, urllib2): not linted here.
# spike/ holds local, untracked investigation scripts.
extend-exclude = ["docker/naoqi/services", "spike"]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
# The fast tier runs in parallel (pytest-xdist), as reachy-mini-bridge's: it is sleep-bound (the
# audio output, the speech and player cores and the fake docker run in real time) more than
# compute-bound. Capped at eight: each worker is a whole interpreter. `logical` counts logical
# cores, as `auto` may count physical ones. `-n 0` runs it serially. tests-e2e/conftest.py forces
# the live tier serial (one stack on 9559).
addopts = ["-n", "logical", "--maxprocesses", "8"]
markers = [
    "container_code: tests code that runs in the Linux containers; CI runs it on Linux only, and Windows skips it (specs/testing/testing.md)",
]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Host-side tests import the container code by module name (tests/conftest.py adds these to sys.path).
extraPaths = [
    "docker/naoqi/services/speech",
    "docker/naoqi/services/audio-device",
    "docker/naoqi/services/audio-player",
    "docker/naoqi/services/status-service",
    "docker/tts-engine",
]
typeCheckingMode = "standard"
